name: Build check
# The site runs as a Node.js app on Hostinger (admin dashboard, database blog
# and /media need a server), and Hostinger's own Git auto-deploy publishes it.
# This workflow only proves that every push still builds in server mode.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
