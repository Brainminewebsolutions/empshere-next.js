name: Deploy to Hostinger (SSH)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BUILD_TARGET: static
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Upload with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_PATH: ${{ secrets.SSH_TARGET_PATH }}
        run: |
          # First run: no --delete, so nothing on the server is removed.
          # Once the site looks right, add "--delete" plus the protect
          # filters below to clear out stale files:
          #   --delete --filter='P /blog/' --filter='P /wp-*' \
          #   --filter='P /.well-known/' --filter='P /cgi-bin/'
          rsync -avz \
            -e "ssh -p $SSH_PORT" \
            ./out/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_PATH/"
